name: Alertas XRP

on:
  schedule:
    # Cada 10 min, todo el dia. Las COMPRAS solo se avisan en horario Peru 9-12 y 15-20;
    # las VENTAS se vigilan siempre que tengas posicion.
    - cron: "*/10 * * * *"
  workflow_dispatch:      # boton "Run workflow" para correrlo a mano
    inputs:
      prueba:
        description: "Mandar solo un mensaje de prueba a Telegram"
        type: boolean
        default: true

permissions:
  contents: write   # para guardar alertas/estado.json y no repetir avisos

concurrency:
  group: alertas-xrp
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar senal
        working-directory: alertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.prueba }}" = "true" ]; then
            python alerta.py --prueba
          else
            python alerta.py
          fi
      - name: Guardar estado
        run: |
          if [ -n "$(git status --porcelain alertas/estado.json docs/datos.json)" ]; then
            git config user.name "alertas-bot"
            git config user.email "alertas-bot@users.noreply.github.com"
            git add alertas/estado.json docs/datos.json
            git commit -m "estado de alertas"
            git pull --rebase
            git push
          fi
